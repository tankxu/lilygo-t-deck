dependencies:
  idf:
    version: ">=5.4"
  # ⚠️ LVGL 钉死在 9.1.x —— 这是【唯一有 Xtensa SIMD】的版本。
  #
  # LVGL 自带的汇编加速只有 neon / helium / riscv_v / arm2d,没有 Xtensa。
  # ESP32-S3 的手写汇编在 esp_lvgl_port 里(src/lvgl9/simd/*_esp32s3.S),
  # 而它的 CMakeLists 把编译条件写死成
  #     if((lvgl_ver >= "9.1.0") AND (lvgl_ver < "9.2.0"))
  # LVGL 9.2 改了 blend 的内部 API,Espressif 之后就没再跟。
  #
  # 这几个汇编加速的正是我们的瓶颈:整屏贴图走的 lv_color_blend_to_rgb565 和
  # lv_rgb565_blend_normal_to_rgb565。纯 C 路径实测约 60~90 周期/像素,
  # 滑动时整屏重画要 35~45ms,肉眼就是"有锯齿感"。
  #
  # 配套要开(见 sdkconfig.defaults):
  #     CONFIG_LV_DRAW_SW_ASM_CUSTOM=y
  #     CONFIG_LV_USE_DRAW_SW_ASM=255
  #     CONFIG_LV_DRAW_SW_ASM_CUSTOM_INCLUDE="esp_lvgl_port_lv_blend.h"
  #
  # ⚠️ 退版本的代价:9.2 之后改过名的 API 在 9.1 里都是老名字
  # (lv_obj_remove_flag → lv_obj_clear_flag 等),全仓库要跟着改。
  # 另外中文字库是结构体裸 dump,换版本必须重新验证(见 docs/hardware.md)。
  lvgl/lvgl:
    version: "~9.1.0"
  # LVGL 9 + Espressif 的移植层(负责 flush 回调、indev、LVGL 任务)
  # ⚠️ esp_lvgl_port 也得跟着退。2.9.0 用了 LV_COLOR_FORMAT_RGB565_SWAPPED,
  # 那是 LVGL 9.2+ 才有的枚举 —— 它 manifest 里写的 "lvgl >=8,<10" 是假的。
  # 2.4.x 是和 LVGL 9.1 同期的版本,而且带着 simd/*_esp32s3.S。
  espressif/esp_lvgl_port:
    version: "~2.4.0"
  # 触摸 GT911
  espressif/esp_lcd_touch_gt911:
    version: "^1.2.1"
  # 音频 codec 抽象,ES7210 驱动在这里(小智同款)
  espressif/esp_codec_dev:
    version: "^1.6.2"
  # Opus/MP3 解码(小智同款,音乐播放器和将来的小智共用)
  espressif/esp_audio_codec:
    version: "^2.4.0"
  # 小智核心要的两个:esp-ml307 提供 http/websocket/mqtt/udp 的统一抽象
  # (它的 Http/WebSocket 接口被 protocols 层直接用),esp-sr 提供 AFE 和
  # 唤醒词模型的路径解析(model_path.h)。
  # 重采样(audio_service 用 esp_ae_rate_cvt)
  espressif/esp_audio_effects:
    version: "*"
  # 2.3.x —— afe_audio_processor 用的是 2.x 的 API(afe_config_init / AFE_TYPE_VC)。
  # 别被小智 lock 里的 1.7.0 误导,那是传递依赖不是直接依赖。
  espressif/esp-sr:
    version: "~2.3.0"
